services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    container_name: avo-mlflow
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlflow
      - ../artifacts:/artifacts
      - ./init-mlflow.sh:/init-mlflow.sh
    command: ["bash", "/init-mlflow.sh"]
    restart: unless-stopped

  jupyter:
    build:
      context: ..
      dockerfile: docker/Dockerfile.jupyter
    container_name: avo-jupyter
    ports:
      - "8888:8888"
    env_file:
      - .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # JUPYTER_TOKEN commented to do not generate conflict with the command below.
      # JUPYTER_TOKEN: ${JUPYTER_TOKEN:-avo}
    volumes:
      - ../notebooks:/home/jovyan/work
      - ../src:/home/jovyan/src
    command: start-notebook.py --IdentityProvider.token='' --IdentityProvider.password=''
    depends_on:
      - mlflow
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: avo-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ../api:/app/api
      - ../src:/app/src
    depends_on:
      - mlflow
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: avo-ollama
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  mlflow_data:
  ollama_data: